<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>MySynth</title>
    <link rel="stylesheet" href="estilo.css" />
  </head>
  <body>
    <main>
      <!-- Barra de cima: controles gerais, sempre visíveis -->
      <header class="barra-topo">
        <h1>MySynth</h1>
        <div class="grupo-oitava">
          <!-- No celular em pé, a palavra "Oitava" some e fica só – / + -->
          <button id="oitava-menos" class="botao" aria-label="Oitava abaixo"><span class="texto-longo">Oitava </span>–</button>
          <span id="rotulo-oitava" class="rotulo">C3</span>
          <button id="oitava-mais" class="botao" aria-label="Oitava acima"><span class="texto-longo">Oitava </span>+</button>
        </div>
        <label class="grupo-volume">
          Volume
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.7" />
        </label>
        <button id="botao-ligar" class="botao botao-destaque">Ligar som</button>
      </header>

      <p id="aviso" class="aviso" hidden></p>

      <!-- Abas: cada uma com uma função só -->
      <nav class="abas" role="tablist">
        <button class="aba ativa" role="tab" aria-selected="true" data-aba="osc">OSC</button>
        <button class="aba" role="tab" aria-selected="false" data-aba="filtro">Filtro</button>
        <button class="aba" role="tab" aria-selected="false" data-aba="env">ENV</button>
        <button class="aba" role="tab" aria-selected="false" data-aba="lfo">LFO</button>
        <button class="aba" role="tab" aria-selected="false" data-aba="fx">FX</button>
      </nav>

      <!-- Opções de voz (valem para o synth todo, visíveis em todas as abas) -->
      <div class="barra-voz">
        <div id="modo-voz" class="grupo-botoes modo-voz">
          <button class="botao" data-modo="mono">Mono</button>
          <button class="botao" data-modo="poly">Poly</button>
        </div>
        <div id="seletor-vozes"></div>
        <!-- Legato (só no Mono): deslizar entre teclas não reinicia o envelope -->
        <button id="legato" class="chave" aria-pressed="true">Legato</button>
      </div>

      <!-- Aba OSC: 3 espaços de oscilador (só o A funciona por enquanto) -->
      <section class="conteudo-aba" data-painel="osc">
        <div class="modulos">
          <article class="cartao">
            <h2 class="titulo-cartao">OSC A</h2>
            <div class="tela-grafico tela-onda">
              <!-- Arrastar no desenho (para os lados ou para cima/baixo) também muda o WT Pos -->
              <canvas id="tela-onda"></canvas>
              <span id="nome-onda" class="nome-onda">Seno</span>
            </div>
            <label class="grupo-wtpos">
              <span>WT Pos</span>
              <input id="wt-pos" type="range" min="0" max="1" step="0.001" value="0" />
            </label>
            <!-- Atalhos: tocar no nome pula direto para aquela forma de onda -->
            <div id="atalhos-wt" class="atalhos-wt"></div>
            <!-- Unison: quantas cópias, quanto desafinam (Detune), quanto abrem no estéreo (Width) -->
            <div id="unison-osc" class="linha-knobs"></div>
          </article>

          <article class="cartao reservado">
            <h2 class="titulo-cartao">OSC B</h2>
            <p class="em-breve">em breve</p>
          </article>

          <article class="cartao reservado">
            <h2 class="titulo-cartao">OSC C</h2>
            <p class="em-breve">em breve</p>
          </article>
        </div>
      </section>

      <!-- Aba Filtro -->
      <section class="conteudo-aba" data-painel="filtro" hidden>
        <div class="modulos">
          <article class="cartao">
            <div class="cabecalho-cartao">
              <h2 class="titulo-cartao">Filtro</h2>
              <button id="filtro-ligado" class="chave" aria-pressed="false">Desligado</button>
            </div>
            <div class="tela-grafico"><canvas id="tela-filtro"></canvas></div>
            <div id="tipos-filtro" class="grupo-botoes"></div>
            <div id="knobs-filtro" class="linha-knobs"></div>
          </article>
        </div>
      </section>

      <!-- Aba ENV: ENV 1 controla o volume; ENV 2 e 3 virão com a modulação -->
      <section class="conteudo-aba" data-painel="env" hidden>
        <div class="modulos">
          <article class="cartao">
            <h2 class="titulo-cartao">ENV 1 · Volume</h2>
            <div class="tela-grafico"><canvas id="tela-envelope"></canvas></div>
            <div id="knobs-envelope" class="linha-knobs"></div>
          </article>

          <article class="cartao reservado">
            <h2 class="titulo-cartao">ENV 2</h2>
            <p class="em-breve">em breve</p>
          </article>

          <article class="cartao reservado">
            <h2 class="titulo-cartao">ENV 3</h2>
            <p class="em-breve">em breve</p>
          </article>
        </div>
      </section>
      <section class="conteudo-aba" data-painel="lfo" hidden>
        <div class="cartao reservado"><h2 class="titulo-cartao">LFOs</h2><p class="em-breve">em breve</p></div>
      </section>
      <section class="conteudo-aba" data-painel="fx" hidden>
        <div class="cartao reservado"><h2 class="titulo-cartao">Efeitos</h2><p class="em-breve">em breve</p></div>
      </section>

      <!-- As teclas são criadas pelo principal.js, conforme o tamanho da tela -->
      <div id="teclado" class="teclado"></div>
    </main>

    <script type="module" src="principal.js"></script>
  </body>
</html>
